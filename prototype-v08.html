<body>
<canvas id="scene" aria-label="Prototype 3D d'île tropicale, d'eau animée et de voilier"></canvas>
<div class="grain" aria-hidden="true"></div>
<header class="masthead">
 <div class="symbol">✧</div>
 <div class="heading"><div class="brand">ARCHIPEL <span>V0.8.1</span></div><p>Hero Island · modèles 3D texturés</p></div>

 </div>
</div>
<button id="ui-restore" class="restore" aria-label="Réafficher le panneau">☰ Menu</button>
