name: Vérification et publication ARCHIPEL
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Tester les règles et le JavaScript
        run: npm test
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Installer les outils de création des assets 3D
        run: python -m pip install numpy==2.2.6 trimesh==4.11.1 Pillow==11.3.0
      - name: Préfabriquer les modèles GLB et leurs textures
        run: python scripts/build_hero_assets.py
      - name: Vérifier les modèles exportés
        run: python scripts/check_hero_assets.py
      - name: Configurer GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Charger le site statique
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Publier ARCHIPEL
        id: deployment
        uses: actions/deploy-pages@v4
