name: ARCHIPEL Browser 3D
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.57.0
      - run: npx playwright install chromium --with-deps
      - name: Tester le plateau 3D sur une fenêtre iPhone
        run: node tests/browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: archipel-browser-screenshots
          path: artifacts/


  online:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Tester deux téléphones et l'autorité du serveur en ligne
        run: node tests/online-api.mjs

  prototype-v08:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy==2.2.6 trimesh==4.11.1 Pillow==11.3.0
      - run: python scripts/build_hero_assets.py
      - run: python scripts/check_hero_assets.py
      - run: npm install --no-save playwright@1.57.0
      - run: npx playwright install chromium --with-deps
      - name: Tester l'île témoin V0.8 en 3D sur iPhone
        run: node tests/prototype-v08-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: archipel-v08-diorama-screenshots
          path: artifacts/archipel-v08-*.png
