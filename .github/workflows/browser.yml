name: ARCHIPEL Browser 3D
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.57.0
      - run: npx playwright install chromium --with-deps
      - name: Tester le plateau 3D sur une fenêtre iPhone
        run: node tests/browser.mjs
      - name: Tester le prototype graphique V0.8 sur iPhone
        run: node tests/prototype-v08-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: archipel-browser-screenshots
          path: artifacts/
